name: Linux runtime checks
on:
  push:
    branches:
      - main
      - feature/linux-dual-boot-foundation
  pull_request:
    branches:
      - main

concurrency:
  group: smarttv-linux-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test Linux backend
        run: linux/test.sh
