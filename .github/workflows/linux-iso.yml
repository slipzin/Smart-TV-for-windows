name: Build Smart TV OS Live ISO

on:
  push:
    branches:
      - feature/linux-dual-boot-foundation
    paths:
      - "linux/**"
      - "pc/build.py"
      - "web/**"
      - "assets/**"
      - ".github/workflows/linux-iso.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Criar uma GitHub Release prerelease e anexar o arquivo 7z após o build'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Tag da versão (ex.: v0.1.0-alpha.1)'
        required: true
        type: string
        default: 'v0.1.0-alpha.1'

concurrency:
  group: smarttv-linux-iso-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-iso:
    name: Build Debian Live ISO (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: feature/linux-dual-boot-foundation

      - name: Build ISO and create 7z archive in Debian 13 container
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -euxo pipefail -c '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates \
                build-essential \
                cmake \
                curl \
                git \
                perl \
                pkg-config \
                cpio \
                debootstrap \
                dosfstools \
                grub-efi-amd64-bin \
                grub-pc-bin \
                isolinux \
                live-build \
                flatpak \
                mtools \
                rsync \
                squashfs-tools \
                syslinux-common \
                syslinux-utils \
                xorriso \
                python3 \
                7zip
              linux/test.sh
              bash linux/validate-profile-packages.sh
              linux/build-iso.sh

              cd out
              ISO="SmartTV-OS-live-trixie-amd64.iso"
              ARCHIVE="SmartTV-OS-live-trixie-amd64.7z"
              sha256sum "$ISO" > "$ISO.sha256"

              # Debian 13 package "7zip" exposes the CLI as 7z; accept 7zz too.
              SEVENZIP="$(command -v 7zz || command -v 7z || true)"
              if [[ -z "$SEVENZIP" ]]; then
                echo "7-Zip CLI was not found after installing Debian package 7zip" >&2
                dpkg -L 7zip >&2 || true
                exit 1
              fi

              # Create a solid LZMA2 archive. If it approaches GitHub
              # per-asset 2 GiB limit, recreate it as 1800 MiB volumes.
              "$SEVENZIP" a -t7z -mx=9 -m0=lzma2 -ms=on "$ARCHIVE" "$ISO"
              ARCHIVE_SIZE=$(stat -c%s "$ARCHIVE")
              SINGLE_FILE_LIMIT=$((1900 * 1024 * 1024))
              if (( ARCHIVE_SIZE >= SINGLE_FILE_LIMIT )); then
                rm -f "$ARCHIVE"
                "$SEVENZIP" a -t7z -mx=9 -m0=lzma2 -ms=on -v1800m "$ARCHIVE" "$ISO"
              fi

              mapfile -t ARCHIVE_FILES < <(find . -maxdepth 1 -type f \
                \( -name "$ARCHIVE" -o -name "$ARCHIVE.*" \) -print | sort)
              if (( ${#ARCHIVE_FILES[@]} == 0 )); then
                echo "7z archive was not created" >&2
                exit 1
              fi
              sha256sum "${ARCHIVE_FILES[@]}" > "$ARCHIVE.sha256"
              ls -lh "$ISO" "$ISO.sha256" "$ARCHIVE.sha256" "${ARCHIVE_FILES[@]}"
            '

      - name: Make build outputs writable for artifact preparation
        run: chmod -R a+rwX out

      - name: Split ISO into downloadable parts (400 MiB each)
        run: |
          set -euo pipefail
          mkdir -p out/iso-parts
          split -b 400m -d -a 3 out/SmartTV-OS-live-trixie-amd64.iso out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-
          cp out/SmartTV-OS-live-trixie-amd64.iso.sha256 out/iso-parts/
          sha256sum out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-* > out/iso-parts/PARTS.sha256

      - name: Upload ISO part 000
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-000
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-000
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 001
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-001
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-001
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 002
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-002
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-002
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 003
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-003
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-003
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 004
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-004
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-004
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 005
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-005
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-005
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 006
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-006
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-006
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 007
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-007
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-007
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 008
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-008
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-008
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 009
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-009
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-009
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 010
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-010
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-010
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 011
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-011
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-011
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 012
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-012
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-012
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 013
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-013
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-013
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 014
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-014
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-014
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO part 015
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-part-015
          path: out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.part-015
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload ISO checksums and part manifest
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-OS-ISO-checksums
          path: |
            out/iso-parts/SmartTV-OS-live-trixie-amd64.iso.sha256
            out/iso-parts/PARTS.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish prerelease with 7z assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          mapfile -t ARCHIVE_ASSETS < <(find out -maxdepth 1 -type f \
            \( -name 'SmartTV-OS-live-trixie-amd64.7z' -o -name 'SmartTV-OS-live-trixie-amd64.7z.[0-9][0-9][0-9]' \) -print | sort)
          if (( ${#ARCHIVE_ASSETS[@]} == 0 )); then
            echo "No 7z archive assets found" >&2
            exit 1
          fi

          TARGET_SHA=$(git rev-parse HEAD)
          gh release create "$RELEASE_TAG" \
            "${ARCHIVE_ASSETS[@]}" \
            out/SmartTV-OS-live-trixie-amd64.7z.sha256 \
            out/SmartTV-OS-live-trixie-amd64.iso.sha256 \
            --target "$TARGET_SHA" \
            --prerelease \
            --title "Smart TV OS $RELEASE_TAG" \
            --notes-file linux/RELEASE-NOTES.md
