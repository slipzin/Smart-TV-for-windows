# Each push to main: when the version in pc/build.py (VERSION) has no Release yet, builds SmartTV-<version>.zip and
# publishes it as Release v<version>. Raising VERSION is what makes a new Release.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(python3 -c "import re;print(re.search(r\"VERSION = '([^']+)'\", open('pc/build.py').read()).group(1))")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build the zip
        if: steps.v.outputs.new == 'true'
        run: python3 pc/build.py --out out/SmartTV --zip "out/SmartTV-${{ steps.v.outputs.version }}.zip"
      - name: Publish the release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          cat > notes.md <<'NOTES'
          **Instalar:** baixe o ZIP abaixo, extraia (no pendrive ou no PC) e dê dois cliques em `INICIAR-TV.bat`.
          Sair: segure View + Menu no controle, Ajustes > Sair do modo TV, ou Alt+F4.

          - Tela inicial de TV em tela cheia, com controle de video game, teclado ou mouse.
          - Abre os aplicativos instalados no Windows (Netflix, Prime Video, Disney+, Apple TV, Spotify, Xbox, Steam Big Picture...).
          - Planos de fundo: 5 animados, 6 estáticos e os seus (imagens, GIF e vídeos da pasta Fundos).
          - Escurecer e desfocar o fundo, velocidade da animação, tema, idioma, abrir junto com o Windows.
          - Não instala nada e não muda o Windows. Requer Windows 10 ou 11 com o Microsoft Edge.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "v$v" "out/SmartTV-$v.zip" --target "$GITHUB_SHA" --title "Smart TV for Windows $v" --notes-file notes.md
